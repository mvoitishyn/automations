name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No private data
        run: scripts/check-private.sh
      - name: Shell lint
        run: shellcheck -S warning install.sh scripts/*.sh .githooks/* flows/*/install.sh flows/meet/meet
      - name: Syntax
        run: |
          for f in $(git ls-files '*.mjs'); do node --check "$f"; done
          python3 -m py_compile flows/meet/*.py

  install:
    name: install on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "fedora:41", "archlinux:latest"]
    steps:
      - name: Dependencies
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null; fi
          if command -v dnf >/dev/null; then dnf install -y -q git >/dev/null; fi
          if command -v pacman >/dev/null; then pacman -Sy --noconfirm --needed --quiet git >/dev/null; fi
      - uses: actions/checkout@v4
      - run: sh scripts/ci-deps.sh
      - run: bash scripts/ci-install-test.sh
